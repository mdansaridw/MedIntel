<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MedIntel clinical intelligence and knowledge graph dashboard"
    />
    <meta name="theme-color" content="#F1F0EB" />
    <title>MedIntel</title>
    <script>
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('medintel-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const isDark = savedTheme ? savedTheme === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-jUHzXcxZ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DvWWDciP.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
